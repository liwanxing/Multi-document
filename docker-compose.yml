# Multi-document 生产部署（一键启动）
#
#   docker compose up -d --build     # 首次构建并启动
#   docker compose up -d             # 日常启动（migrate 会自动追平新迁移）
#   docker compose logs -f app       # 看应用日志
#
# 结构：db（MySQL 8）→ migrate（prisma migrate deploy，跑完退出）→ seed（可选，灌入演示数据）→ app（Next standalone）
# 说明：
# - db 不映射宿主机端口，最小暴露面；维护用 docker compose exec db mysql -uroot -p
# - 首次启动空库时应用会在首次请求自动写入默认角色与账号（admin/admin123）
# - SEED_DEMO=true（默认）时 seed 服务会在空库灌入"中广云 + 大数据"演示数据，开箱即看；
#   不需要演示数据时设 SEED_DEMO=false，即可获得纯空库
# - 上传文件持久化在 uploads-data 卷（/app/data/uploads）

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-multidoc123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-multi_document}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: deps   # 全量依赖阶段：含 prisma CLI 与迁移文件
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_PASSWORD:-multidoc123}@db:3306/${MYSQL_DATABASE:-multi_document}
    depends_on:
      db:
        condition: service_healthy

  # 演示数据种子：全新空库时灌入"中广云 + 大数据"两个演示站点（产品/文档/挂载/版本快照）。
  # 开关：SEED_DEMO=false 关闭；库非空时自动跳过（幂等），强制重灌设 SEED_DEMO_FORCE=1。
  # 角色与账号不在此灌入——应用首次读取会自动初始化默认角色与 admin/operator。
  seed:
    build:
      context: .
      target: deps
    command: sh -c "if [ \"$$SEED_DEMO\" = \"true\" ]; then node scripts/seed-demo.mjs; else echo '[seed] SEED_DEMO 未开启，跳过演示数据'; fi"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_PASSWORD:-multidoc123}@db:3306/${MYSQL_DATABASE:-multi_document}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"   # 一次性任务，跑完即退出

  app:
    build:
      context: .
      target: runner
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_PASSWORD:-multidoc123}@db:3306/${MYSQL_DATABASE:-multi_document}
      DATA_BACKEND: mysql
      # 生产环境请修改会话签名密钥：docker compose 会在同目录 .env 读取覆盖值
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-multidoc-secret-change-me}
      TZ: Asia/Shanghai
    volumes:
      - uploads-data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql-data:
  uploads-data:
