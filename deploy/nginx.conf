# 反向代理层
#
# 存在理由（不是常规优化，是针对这条链路的补丁）：
#   从外部访问本机时，每条【新建】TCP 连接的首字节固定要等约 9.5 秒
#   —— 中间设备丢弃新会话的前几个包，靠 TCP 定时重传恢复，所以时间恒定。
#   但连接一旦建立，同一连接上的后续请求只要 0.03 秒。
#
# 因此策略是：让浏览器尽量少建连接、建了就长期保持。
#   keepalive_timeout 300s  → 浏览器一次建连后可复用 5 分钟
#   upstream keepalive      → nginx 到应用也复用（走容器内网回环，本身不受该问题影响）
#
# 效果：首次打开页面等一次约 9.5 秒，之后登录、翻页、点菜单全部毫秒级。

upstream nextjs {
    server app:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # 文档/附件上传
    client_max_body_size 200m;
    client_body_timeout 300s;

    # 浏览器连接保持 5 分钟，避免反复新建连接
    keepalive_timeout 300s;
    keepalive_requests 10000;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xhtml+xml image/svg+xml;

    # Next.js 带 hash 的静态资源，可长期缓存，第二次打开几乎零请求
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 关闭缓冲，让 SSR 首字节直接透传
        proxy_buffering off;
    }
}
