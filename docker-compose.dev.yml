services:
  mysql:
    image: mysql:8.0
    container_name: multi-doc-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: multidoc123
      MYSQL_DATABASE: multi_document
      TZ: Asia/Shanghai
    volumes:
      - multi-doc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  multi-doc-mysql-data:
